# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ru-RU"

reviews:
  # Более спокойный стиль ревью, без лишней придирчивости.
  profile: "chill"

  # Комментирует ошибки, но не ставит Request changes.
  request_changes_workflow: false

  # Добавляет общее описание изменений.
  high_level_summary: true

  # Показывает состояние ревью.   
  review_status: true

  # Показывает использованный контекст и пропущенные файлы.
  review_details: true

  # Создаёт GitHub status check для ревью.
  commit_status: true

  # Не блокирует PR, если CodeRabbit временно не смог провести ревью.
  fail_commit_status: false

  # Не добавляет стихотворение.
  poem: false

  path_instructions:
  - path: "apps/web/**"
    instructions: |
      Проверяй Next.js App Router, TypeScript и доступность интерфейса.
      Проверяй корректное разделение Server и Client Components.
      Проверяй SEO, metadata, loading и error states.
      Проверяй корректное использование next/image.
      Обращай внимание на адаптивность и обработку ошибок API.

      Проверяй архитектуру компонентов и возможность переиспользования кода.
      Выявляй дублирование компонентов, хуков, утилит и типов.
      Предлагай выделение общих компонентов только при реальной повторяемости.
      Не предлагай преждевременные абстракции для одноразового кода.
      Проверяй, что бизнес-логика не находится внутри UI-компонентов.
      Проверяй, что переиспользуемая логика вынесена в hooks, lib или utils.

  - path: "apps/api/**"
    instructions: |
      Проверяй архитектуру NestJS и разделение ответственности модулей.
      Проверяй DTO, ValidationPipe, авторизацию и права доступа.
      Проверяй обработку ошибок, транзакции и безопасность входных данных.
      Обращай внимание на race conditions при бронировании.

      Выявляй дублирование в controllers, services, guards и repositories.
      Предлагай переиспользуемые сервисы и функции для общей бизнес-логики.
      Проверяй, что controllers не содержат бизнес-логику.
      Проверяй, что общие validators, decorators, guards и filters
      вынесены в подходящие модули.
      Не предлагай создание общего abstraction только ради устранения
      небольшого визуального сходства кода.

  - path: "apps/api/prisma/**"
    instructions: |
      Проверяй связи Prisma-моделей, индексы и уникальные ограничения.
      Проверяй безопасность миграций и влияние изменений на существующие данные.
      Проверяй защиту от пересекающихся периодов бронирования.
      Проверяй корректность onDelete и onUpdate для связей.
      Выявляй дублирование полей и неправильно разделённые сущности.

  auto_review:
    # Автоматически запускать ревью.
    enabled: true

    # Проверять изменения после каждого нового push.
    auto_incremental_review: true

    # Не приостанавливать ревью после нескольких коммитов.
    auto_pause_after_reviewed_commits: 0

    # Проверять Draft Pull Requests.
    drafts: true

    # Проверять PR независимо от целевой ветки.
    base_branches:
      - ".*"

    # Не фильтровать PR по labels.
    labels: []

chat:
  # Автоматически отвечать на обращения к @coderabbitai.
  auto_reply: true
